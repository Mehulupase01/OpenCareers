name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm public:scan
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: test-results/
          retention-days: 7
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:7ad98329d513dd497293b951c195ca354274a77f12ddbbbbf85e68a811823d72
        env:
          POSTGRES_USER: opencareers_test
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: opencareers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencareers_test -d opencareers_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOPILOT_TEST_DATABASE_URL: postgresql://opencareers_test:synthetic-test-only@127.0.0.1:5432/opencareers_test
      REQUIRE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
